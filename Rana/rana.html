<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            background: linear-gradient(135deg, #3f51b5, #5c6bc0);
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }
        .sidebar h4 {
            color: white;
            text-align: center;
            font-weight: 600;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.3);
            font-weight: 700;
            border-left: 4px solid white;
        }

        /* Content Layout */
        .content {
            margin-left: 270px;
            padding: 40px 20px;
        }
        .box {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .button {
            border-radius: 5px;
        }
        .input, .textarea, .select select {
            border-radius: 5px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                width: 220px;
            }
            .content {
                margin-left: 240px;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding-bottom: 10px;
            }
            .content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
<body>
    <div class="sidebar">
    <h4>📖 Campus Hub</h4>
    <a href="#">🏠 Home</a>
    <a href="#"> 📅 Event Calender</a>
    <a href="#">👥 Study group Finder</a>
    <a href="#">⭐ Course Reviews</a>
    <a href="#">📚 Course Notes</a>
    <a href="#" class="active" >📰 Campus News</a>
    <a href="#"> 👥 Club Activities</a>
    <a href="#"> 💰 Student Marketplace</a>
    
    
</div>
<body>

    <button>Filter</button>

</body>
</html>
