<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course Review Detail | Campus Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
</head>
<body>
  <section class="section">
    <div class="container">
      <p id="loading">Loading…</p>
      <p id="error" style="color:red;"></p>
      <h2 class="title is-3"></h2>
      <div id="review-container"></div>

      <!-- This form stays here for adding new comments -->
      <div class="box mt-5">
        <h4 class="title is-4">Add Your Comment</h4>
        <form id="commentForm">
          <div class="field">
            <label class="label">Your Name</label>
            <div class="control">
              <input class="input" type="text" placeholder="Enter your name" required />
            </div>
          </div>
          <div class="field">
            <label class="label">Your Comment</label>
            <div class="control">
              <textarea class="textarea" placeholder="Share your thoughts..." required></textarea>
            </div>
          </div>
          <div class="buttons">
            <button type="submit" class="button is-primary">Submit Comment</button>
            <a href="courseReview.html" class="button is-light">← Back to Reviews</a>
          </div>
        </form>
      </div>
    </div>
  </section>
  <script src="reviewDetails.js" defer></script>
</body>
</html>
