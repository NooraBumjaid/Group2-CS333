<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .top-bar h1 {
      margin: 0;
      color: #2c3e50;

    }

    .page-title {
      text-align: center;
      color: #2c3e50;
      margin-top: -20px;
      margin-bottom: 30px;
    }


    .back-btn {
      padding: 8px 15px;
      font-size: 14px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .back-btn:hover {
      background-color: #1a252f;
    }

    .item {
      background-color: #fff;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
    }

    .item img {
      width: 100px;
      height: 100px;
      margin-right: 20px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .item-details {
      flex: 1;
    }

    .item-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .remove-btn {
      margin-top: 10px;
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background-color: #c0392b;
    }

    .total {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
      text-align: right;
      color: #27ae60;
    }

    .pay-btn {
      display: block;
      margin: 20px auto 0;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      background-color: #2980b9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .pay-btn:hover {
      background-color: #1c5980;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <button class="back-btn" onclick="window.location.href='index.html'">🔙 Back to Home</button>
  </div>
  <h1 class="page-title">🛒 My Purchases</h1>
  <div id="cart-items"></div>
  <div class="total" id="cart-total">Total: 0 BHD</div>
  <button class="pay-btn" onclick="alert('الله فلوس')">💳 Pay Now</button>

  <script>
    function removeItemFromCart(index) {
      let cartItems = JSON.parse(localStorage.getItem("cart")) || [];
      cartItems.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cartItems));
      renderCart();
    }

    function renderCart() {
      const cartContainer = document.getElementById("cart-items");
      const totalEl = document.getElementById("cart-total");
      const cartItems = JSON.parse(localStorage.getItem("cart")) || [];

      cartContainer.innerHTML = "";
      let total = 0;

      cartItems.forEach((item, index) => {
        const div = document.createElement("div");
        div.classList.add("item");
        div.innerHTML = `
          <img src="${item.imageUrl}" alt="${item.title}">
          <div class="item-details">
            <div class="item-title">${item.title}</div>
            <div>${item.price.toFixed(2)} BHD</div>
            <button class="remove-btn" onclick="removeItemFromCart(${index})">Remove</button>
          </div>
        `;
        total += parseFloat(item.price);
        cartContainer.appendChild(div);
      });

      totalEl.textContent = "Total: " + total.toFixed(2) + " BHD";
    }

    document.addEventListener("DOMContentLoaded", renderCart);
  </script>

</body>

</html>
