<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add or Edit Comment</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    .custom-blue {
      background-color: #0074D9;
      color: white;
      border: none;
    }
    .custom-box {
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<!-- Back Button -->
<div class="container mt-5">
  <a href="rana.html" class="button custom-blue">⬅️ Back to Main Page</a>
</div>

<!-- Add/Edit Comment Form -->
<div class="container mt-6">
  <div class="columns is-centered">
    <div class="column is-half">
      <div class="box custom-box">
        <h1 class="title has-text-centered">💬 Add or Edit Comment</h1>

        <form id="commentForm">
          <!-- Username -->
          <div class="field">
            <label class="label">Your Name</label>
            <div class="control">
              <input class="input" type="text" id="username" placeholder="Enter your name" required>
            </div>
          </div>

          <!-- Profile Picture Upload -->
          <div class="field">
            <label class="label">Profile Picture</label>
            <div class="control">
              <input class="input" type="file" id="profilePic" accept="image/*">
            </div>
          </div>

          <!-- Choose Submission Type -->
          <div class="field">
            <label class="label">Submission Type</label>
            <div class="control">
              <label class="radio">
                <input type="radio" name="submissionType" value="photo"> Photo
              </label>
              <label class="radio ml-4">
                <input type="radio" name="submissionType" value="link"> Link
              </label>
              <label class="radio ml-4">
                <input type="radio" name="submissionType" value="none" checked> No Upload
              </label>
            </div>
          </div>

          <!-- Upload or Link Field (hidden initially) -->
          <div class="field uploadField" style="display: none;">
            <label class="label">Upload Photo</label>
            <div class="control">
              <input class="input" type="file" id="uploadField" accept="image/*">
            </div>
          </div>

          <div class="field linkField" style="display: none;">
            <label class="label">Enter Link</label>
            <div class="control">
              <input class="input" type="url" id="linkField" placeholder="https://example.com">
            </div>
          </div>

          <!-- Comment Textarea -->
          <div class="field">
            <label class="label">Comment Text</label>
            <div class="control">
              <textarea class="textarea" id="commentText" placeholder="Write your comment..." rows="4" required></textarea>
            </div>
          </div>

          <!-- Submit Buttons -->
          <div class="field is-grouped is-grouped-centered mt-5">
            <div class="control">
              <button type="submit" class="button is-primary">📨 Submit / Reply</button>
            </div>
            <div class="control">
              <button type="reset" class="button is-danger">🗑️ Clear Form</button>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

<script src="addcomment.js"></script>
</body>
</html>
