<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus News</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            background: linear-gradient(135deg, #3f51b5, #5c6bc0);
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }
        .sidebar h4 {
            color: white;
            text-align: center;
            font-weight: 600;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.3);
            font-weight: 700;
            border-left: 4px solid white;
        }

        /* Content Layout */
        .content {
            margin-left: 270px;
            padding: 40px 20px;
        }
        .box {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* News card styling */
        .card {
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .card-content {
            flex-grow: 1;
            padding: 1.5rem;
        }
        .card-footer {
            margin-top: auto;
            border-top: 1px solid #f0f0f0;
            background-color: #fcfcfc;
        }
        .card-image img {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }
        .card .title {
            font-weight: bold;
            margin-bottom: 0.75rem;
            color: #333;
        }
        .card .subtitle {
            color: #666;
            margin-bottom: 1rem;
        }
        .button {
            border-radius: 5px;
        }
        .input, .textarea, .select select {
            border-radius: 5px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                width: 220px;
            }
            .content {
                margin-left: 240px;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding-bottom: 10px;
            }
            .content {
                margin-left: 0;
                padding: 20px;
            }
        }

        .main-content {
            margin-left: 275px;
            padding: 20px;
        }

        .news-posts-card {
            margin-left: auto; 
            max-width: 80%; 
        }  

        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }

        .pagination {
            display: flex;
            align-items: center; 
            gap: 5px;
        }

        .pagination-list {
            display: flex !important;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
            gap: 5px;
        }

        .pagination-previous,
        .pagination-next,
        .pagination-link,
        .pagination-ellipsis {
            padding: 0.5rem 0.75rem;
            border: 1px solid #dbdbdb;
            text-decoration: none;
            color: #363636;
            background-color: #fff;
            font-size: 0.875rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 2.25em;
        }

        .pagination-ellipsis {
            border: none;
        }

        .pagination-link.is-current {
            background-color: #00d1b2;
            color: #fff;
            border-color: #00d1b2;
        }

        .pagination-link:hover:not(.is-current):not(.is-disabled) {
            background-color: #f5f5f5;
        }

        .pagination-link.is-disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .form-right {
            margin-left: auto;
            margin-right: 80px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
        }

        .modal.is-active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            animation: spinAround 800ms infinite linear;
            border: 4px solid #3273dc;
            border-radius: 50%;
            border-right-color: transparent;
            border-top-color: transparent;
            content: "";
            display: block;
            height: 3em;
            width: 3em;
            margin: 0 auto;
        }
        
        #loading-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        #loading-spinner.is-active {
            display: flex !important;
        }

        @keyframes spinAround {
            from { transform: rotate(0deg); }
            to { transform: rotate(359deg); }
        }

        .button.is-primary.is-active {
            background-color: #ff4081;
        }
        
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h4>📖 Campus Hub</h4>
        <a href="#" class="active">🏠 Home</a>
        <a href="#">📅 Event Calendar</a>
        <a href="#">👥 Study Group Finder</a>
        <a href="#">⭐ Course Reviews</a>
        <a href="#">📚 Course Notes</a>
        <a href="#">📰 Campus News</a>
        <a href="#">👥 Club Activities</a>
        <a href="#">💰 Student Marketplace</a>
    </div>

    <!--main page content-->
    <div class="main-content">
        <!--title-->
        <h1 class="title is-1" style="color: darkblue;">Campus News</h1>

        <!--search bar & filter & sort-->
        <div class="columns mb-5">
            <div class="column is-6">
                <input class="input" type="text" id="search-news" placeholder="Search news">
            </div>
            <div class="column is-2">
                <div class="select" id="news-filter">
                    <select>
                        <option value="no-filter-option">Department</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Business">Business</option>
                        <option value="Science">Science</option>
                        <option value="Arts & Design">Arts & Design</option>
                        <option value="Medicine & Health">Medicine & Health</option>
                        <option value="Law">Law</option>
                        <option value="Education">Education</option>
                        <option value="Sports">Sports</option>
                        <option value="Technology">Technology</option>
                    </select>
                </div>
            </div>
            <div class="column is-2">
                <div class="select" id="news-sort">
                    <select>
                        <option value="no-sort-option">Sort by</option>
                        <option value="sort-by-date">Date</option>
                        <option value="most-popular">Most popular</option>
                        <option value="from-A-to-Z">A to Z</option>
                        <option value="from-Z-to-A">Z to A</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- News Cards -->
        <div class="news-posts-card">
            <div class="columns is-multiline is-centered" id="news-cards-container">
                <!-- Cards will be dynamically inserted here -->
                
                <!-- 
                Static example cards are commented out since they're just for display purposes.
                The dynamically loaded cards from the script will appear instead.
                -->
            </div>
        </div>

        <!-- Pagination Controls -->
        <div class="pagination-container">
            <nav class="pagination" role="navigation" aria-label="pagination">
                <div id="pagination-pages"></div>
            </nav>
        </div>

        <!-- Add Post Button -->
        <div class="columns mt-4">
            <div class="column is-one-quarter" style="margin-left: 345px;">
                <button id="add-post-btn" class="button is-primary is-fullwidth">Add Post</button>
            </div>
        </div>

        <!-- Form for Adding/Editing News -->
        <div id="add-post-form" class="mt-4" style="display: none;">
            <div class="columns">
                <div class="column is-two-thirds form-right">
                    <div class="box" style="padding: 20px;">
                        <h2 class="title is-4" id="form-title">Add New Post</h2>
                        <form id="post-form">
                            <!-- Title Input -->
                            <div class="field">
                                <label class="label">Title</label>
                                <div class="control">
                                    <input class="input" type="text" id="post-title" name="title" placeholder="Enter the title of the news" required>
                                </div>
                            </div>

                            <!-- Author Input -->
                            <div class="field">
                                <label class="label">Author</label>
                                <div class="control">
                                    <input class="input" type="text" id="post-author" name="author" placeholder="Enter the author's name" required>
                                </div>
                            </div>

                            <!-- Department Dropdown -->
                            <div class="field">
                                <label class="label">Department</label>
                                <div class="control">
                                    <div class="select is-fullwidth">
                                        <select id="department-select" name="department" required>
                                            <option value="">Select department</option>
                                            <option value="Engineering">Engineering</option>
                                            <option value="Business">Business</option>
                                            <option value="Science">Science</option>
                                            <option value="Arts & Design">Arts & Design</option>
                                            <option value="Medicine & Health">Medicine & Health</option>
                                            <option value="Law">Law</option>
                                            <option value="Education">Education</option>
                                            <option value="Sports">Sports</option>
                                            <option value="Technology">Technology</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Header Text -->
                            <div class="field">
                                <label class="label">Header (Brief Summary)</label>
                                <div class="control">
                                    <input class="input" type="text" id="post-header" name="header" placeholder="Enter a brief summary (will appear in cards)" required>
                                </div>
                            </div>

                            <!-- News Details Textarea -->
                            <div class="field">
                                <label class="label">News Details</label>
                                <div class="control">
                                    <textarea class="textarea" id="post-details" name="details" placeholder="Enter the full details of the news" required></textarea>
                                </div>
                            </div>

                            <!-- Image Upload -->
                            <div class="field">
                                <label class="label">Upload Image</label>
                                <div class="control">
                                    <input class="input" type="file" id="post-image" name="image" accept="image/*">
                                </div>
                            </div>

                            <!-- Submit and Cancel Buttons -->
                            <div class="buttons mt-4">
                                <button type="submit" class="button is-success is-fullwidth">Submit</button>
                                <button type="button" class="button is-danger is-fullwidth mt-2" id="cancel-post">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="modal">
        <div class="modal-background"></div>
        <div class="modal-content">
            <div class="box has-text-centered">
                <div class="spinner is-size-1"></div>
                <p class="mt-3">Loading...</p>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification-container" class="notification-container"></div>

    <script src="api.js"></script>
    <script src="script.js"></script>
    <script>
        // Debugging script to check if API and example.json load correctly
        console.log('rana.html loaded, checking for newsApi and data loading...');
        
        // Direct event listener for testing
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM fully loaded');
            
            // Debug container IDs
            console.log('Checking container IDs:');
            console.log('news-cards-container exists:', !!document.getElementById('news-cards-container'));
            console.log('pagination-pages exists:', !!document.getElementById('pagination-pages'));
            
            // Debug image loading
            console.log('Checking image availability:');
            
            // Create test images to verify loading
            const imageUrls = [
                window.location.origin + '/collage.PNG',
                window.location.origin + '/man.PNG',
                window.location.origin + '/woman.PNG'
            ];
            
            // Create a test div to check image loading
            const testDiv = document.createElement('div');
            testDiv.style.display = 'none';
            testDiv.innerHTML = `
                <div id="image-test-container">
                    <img id="test-img-1" src="${imageUrls[0]}" onload="console.log('collage.PNG loaded successfully')" onerror="console.error('Failed to load collage.PNG')">
                    <img id="test-img-2" src="${imageUrls[1]}" onload="console.log('man.PNG loaded successfully')" onerror="console.error('Failed to load man.PNG')">
                    <img id="test-img-3" src="${imageUrls[2]}" onload="console.log('woman.PNG loaded successfully')" onerror="console.error('Failed to load woman.PNG')">
                </div>
            `;
            document.body.appendChild(testDiv);
            
            // After 2 seconds, check if data was loaded
            setTimeout(function() {
                console.log('Checking newsApi and data after 2s:');
                console.log('newsApi exists:', !!window.newsApi);
                if (window.newsPortal) {
                    console.log('newsPortal exists:', !!window.newsPortal);
                    console.log('Posts loaded:', window.newsPortal.posts.length);
                    console.log('Comments loaded:', window.newsPortal.comments.length);
                    
                    // Check image paths in posts
                    if (window.newsPortal.posts.length > 0) {
                        console.log('First few post image paths:');
                        window.newsPortal.posts.slice(0, 3).forEach((post, i) => {
                            console.log(`Post ${i+1} image:`, post.image);
                        });
                    }
                } else {
                    console.log('newsPortal not found, possible script error');
                }
                
                // Check cards container content
                const container = document.getElementById('news-cards-container');
                if (container) {
                    console.log('Cards container children:', container.children.length);
                }
                
                // Clean up test div
                document.body.removeChild(testDiv);
            }, 2000);
        });
    </script>
</body>
</html>
