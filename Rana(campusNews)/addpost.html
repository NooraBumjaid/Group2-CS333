<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Post</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        .custom-blue {
            background-color: #0074D9;
            color: white;
            border: none;
        }
        .comment-thread {
            margin-left: 2rem;
            border-left: 2px solid #dbdbdb;
            padding-left: 1rem;
        }
        .reply-indicator {
            color: #4a4a4a;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- Back to Main Page Button -->
    <div class="container mt-4">
        <a href="rana.html" class="button custom-blue">⬅️ Back to Main Page</a>
    </div>

    <!-- View Post Page -->
    <div class="container mt-6">
        <div class="box" style="padding: 30px;">
            <!-- Title -->
            <h1 class="title is-2 has-text-centered" id="post-title"></h1>

            <!-- Author and Department -->
            <div class="has-text-centered">
                <p class="subtitle is-6 has-text-grey">
                    By <strong id="post-author"></strong> | <span id="post-date"></span>
                </p>
                <p class="tag is-info is-medium" id="post-department"></p>
            </div>

            <!-- Image and Text Layout -->
            <div class="columns mt-4">
                <!-- Left Column: Image -->
                <div class="column is-one-third">
                    <figure class="image">
                        <img id="post-image" src="" alt="News Image" 
                            style="border-radius: 8px; width: 100%; height: auto;">
                    </figure>
                </div>

                <!-- Right Column: Text -->
                <div class="column is-two-thirds">
                    <div class="content">
                        <p id="post-details"></p>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="buttons is-centered mt-4">
                <button class="button is-warning" id="edit-post-btn">Edit Post</button>
                <button class="button is-danger" id="delete-post-btn">🗑️ Delete Post</button>
                <button class="button is-primary" id="like-post-btn">
                    <span class="icon" id="like-icon">❤️</span>
                    <span id="like-count">0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Comment Section Header -->
    <div class="container">
        <div class="columns is-vcentered mt-4">
            <div class="column">
                <h2 class="title is-3" style="color: darkblue;">Comments</h2>
            </div>
            <div class="column has-text-right">
                <button class="button is-primary" id="add-comment-btn">Add Comment</button>
            </div>
        </div>

        <!-- Comments Container -->
        <div class="comments-container mb-6">
            <!-- Comments will be dynamically inserted here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
