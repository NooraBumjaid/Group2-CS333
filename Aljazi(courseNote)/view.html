<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Course Note Detail | Campus Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

  <section class="section">
    <div class="container">
      <h2 class="title is-3">Course Note Details</h2>

      <!-- Detail will be injected here -->
      <div class="box mt-4" id="noteDetail">
        <p>Loading details…</p>
      </div>

      <!-- Comments will be injected here -->
      <div class="content mb-3" id="commentsContainer">
        <p>Loading comments…</p>
      </div>

      <!-- Add Comment Form -->
      <div class="box mt-5">
        <h4 class="title is-4">Add Your Comment</h4>
        <form id="commentForm">
          <div class="field">
            <label class="label">Your Name</label>
            <div class="control">
              <input class="input" type="text" placeholder="Enter your name" required>
            </div>
          </div>
          <div class="field">
            <label class="label">Your Comment</label>
            <div class="control">
              <textarea class="textarea" placeholder="Share your thoughts…" required></textarea>
            </div>
          </div>
          <div class="buttons">
            <button type="submit" class="button is-primary">Submit Comment</button>
            <a href="courseNote.html" class="button is-light">← Back to Main Page</a>
          </div>
        </form>
      </div>
    </div>
  </section>

  <script src="view-note.js"></script>

  <!-- Edit Note Modal -->
  <div class="modal" id="editNoteModal">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Edit Note</p>
        <button class="delete" aria-label="close" id="closeEditModal"></button>
      </header>
      <section class="modal-card-body">
        <form id="editNoteForm">
          <input type="hidden" id="editNoteId">
          <div class="field">
            <label class="label">Course Name</label>
            <div class="control">
              <input class="input" type="text" id="editCourseName" required>
            </div>
          </div>
          <div class="field">
            <label class="label">Note Title</label>
            <div class="control">
              <input class="input" type="text" id="editNoteTitle" required>
            </div>
          </div>
          <div class="field">
            <label class="label">Description</label>
            <div class="control">
              <input class="input" type="text" id="editDescription" required>
            </div>
          </div>
          <div class="field">
            <label class="label">Department</label>
            <div class="control">
              <div class="select">
                <select id="editDepartment" required>
                  <option value="computer-science">Computer Science</option>
                  <option value="information-system">Information System</option>
                  <option value="network-engineering">Network Engineering</option>
                  <option value="Elective">Elective</option>
                </select>
              </div>
            </div>
          </div>
          <div class="field">
            <label class="label">File URL</label>
            <div class="control">
              <input class="input" type="text" id="editFileUrl" required>
            </div>
          </div>
          <button type="submit" class="button is-success">Save Changes</button>
        </form>
      </section>
    </div>
  </div>
</body>
</html>
