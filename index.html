<!DOCTYPE html>
<html lang="en">
<head>
  <title>Campus Hub</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }
    nav {
      background: linear-gradient(135deg, #3f51b5, #5c6bc0);
      padding: 1rem;
    }
    nav .navbar-item,
    nav .navbar-brand .navbar-item {
      color: white;
      font-weight: bold;
    }
    nav .navbar-item:hover {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
    }
    .hero.is-primary {
      background: linear-gradient(135deg, #7986cb, #5c6bc0);
    }
    .card:hover {
      transform: translateY(-5px);
      transition: all 0.3s ease-in-out;
    }
  </style>
</head>
<body>


    <!--MAIN INTRO -->
<section class="hero is-fullheight is-relative" style="padding: 0; overflow: hidden;">
    <img src="main.png" alt="Campus Hub Welcome" style="
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      object-fit: cover;
      z-index: -1;
    ">
    </div>
  </section>
  
  
  
  <!-- sub webpages -->
  <section class="section">
    <div class="container">
      <div class="columns is-multiline">
        <div class="column is-one-third">
          <a href="../Bayan(EventsCalendar)/EventsCalendar.html">
            <div class="card">
              <div class="card-content has-text-centered">
                <p class="title is-4">📅 Event Calendar</p>
                <p> University events </p>
              </div>
            </div>
          </a>
        </div>

        <div class="column is-one-third">
          <a href="../Manar(StudyGroupFinder)/SGF.html">
            <div class="card">
              <div class="card-content has-text-centered">
                <p class="title is-4">👥 Study Groups</p>
                <p>study easily with your classmates</p>
              </div>
            </div>
          </a>
        </div>

        <div class="column is-one-third">
          <a href="../Noora(courseReview)/courseReview.html">
            <div class="card">
              <div class="card-content has-text-centered">
                <p class="title is-4">⭐ Course Reviews</p>
                <p>course feedback</p>
              </div>
            </div>
          </a>
        </div>

        <div class="column is-one-third">
          <a href="../Aljazi(courseNote)/courseNote.html">
            <div class="card">
              <div class="card-content has-text-centered">
                <p class="title is-4">📚 Course Notes</p>
                <p>helping notes</p>
              </div>
            </div>
          </a>
        </div>

        <div class="column is-one-third">
          <a href="../Rana(campusNews)/rana.html">
            <div class="card">
              <div class="card-content has-text-centered">
                <p class="title is-4">📰 Campus News</p>
                <p>what's happening in campus</p>
              </div>
            </div>
          </a>
        </div>

        <div class="column is-one-third">
          <a href="../Suad(clubActivites)/index.html">
            <div class="card">
              <div class="card-content has-text-centered">
                <p class="title is-4">👥 Club Avtivites</p>
                <p>Having Fun</p>
              </div>
            </div>
          </a>
        </div>

        <div class="column is-one-third">
          <a href="../Fatema(studentMarketPlace)/index.html">
            <div class="card">
              <div class="card-content has-text-centered">
                <p class="title is-4">💰 Marketplace</p>
                <p>buy and sell staff</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </section>

</html>
