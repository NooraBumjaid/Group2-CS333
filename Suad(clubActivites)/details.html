<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Details</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Activity Details</h1>
        
        <div id="loading-spinner" class="text-center" style="display:none;">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>

        <!-- Activity Details will be inserted dynamically -->
        <div id="activity-card" class="card" style="display:none;">
            <!-- Dynamic Content will go here -->
        </div>

        <div class="d-flex justify-content-between mt-4">
            <button id="edit-btn" class="btn btn-warning">Edit</button>
            <a href="index.html" onclick="return confirm('Are you sure you want to delete this activity details?')" class="btn btn-danger">Delete</a>
        </div>

        <h3 class="mt-4">Comments</h3>
        <div id="comments-list">
            <p>No comments yet.</p>
        </div>

        <div class="form-group mt-3">
            <textarea id="comment-input" class="form-control" placeholder="Write a comment..."></textarea>
            <button id="add-comment-btn" class="btn btn-primary mt-2">Add Comment</button>
        </div>

        <a href="index.html" class="btn btn-secondary mt-2">Back to Activities</a>
    </div>
    <script src="details.js" defer></script>
</body>
</html>
