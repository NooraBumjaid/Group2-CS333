<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study Group Details | Campus Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
    <style>
      .container {
        max-width: 800px;
        margin-top: 40px;
      }
      .comment {
        background-color: #f5f5f5;
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .buttons {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>

    <section class="section">
      <div class="container">
        <a href="SGF.html" class="button is-link mb-4">← Back to Finder</a>

        <!-- Group Info -->
        <div class="box">
          <h1 class="title is-3"></h1>
          <h2 class="subtitle is-5"></h2>
          <p></p>
          <p></p>
          <p></p>

          <div class="buttons">
            <a href="#" id="edit-btn" class="button is-warning">✏️ Edit</a>
            <a href="#" class="button is-danger">🗑️ Delete</a>
          </div>
        </div>

        <!-- Members -->
        <div class="box">
          <h2 class="title is-4">👥 Group Members</h2>
          <ul> </ul>
        </div>

        <!-- Comments & Form (injected by JS) -->
        <div class="box"></div>

      </div>

      <!-- Edit Group Modal -->
      <div class="modal" id="edit-modal">
        <div class="modal-background"></div>
        <div class="modal-card">
          <header class="modal-card-head">
            <p class="modal-card-title">Edit Group</p>
            <button class="delete" aria-label="close" id="close-edit-modal"></button>
          </header>
          <section class="modal-card-body">
            <form id="edit-form">
              <input type="hidden" id="edit-group-id">
              <!-- Name -->
              <div class="field">
                <label class="label">Group Name</label>
                <input class="input" id="edit-name" required>
              </div>
              <!-- Major -->
              <div class="field">
                <label class="label">Major</label>
                <div class="select is-fullwidth">
                  <select id="edit-major" required>
                    <option>Computer Science</option>
                    <option>Information System</option>
                    <option>Network Engineering</option>
                    <option>Elective Courses</option>
                  </select>
                </div>
              </div>
              <!-- Meeting Time -->
              <div class="field">
                <label class="label">Meeting Time</label>
                <input class="input" id="edit-meeting" required>
              </div>
              <div class="field">
                <label class="label">Description</label>
                <textarea class="textarea" id="edit-description" required></textarea>
              </div>
              <!-- Members -->
              <div class="field">
                <label class="label">Members (one per line: Name: Major)</label>
                <div class="control">
                  <textarea id="edit-members" class="textarea" rows="5" placeholder="Ali: Computer Science"></textarea>
                </div>
              </div>
            </form>
          </section>
          <footer class="modal-card-foot">
            <button type="button" class="button is-success" id="save-edit">Save Changes</button>
            <button type="button" class="button" id="cancel-edit">Cancel</button>
          </footer>
        </div>
      </div>

    </section>

    <script src="./studyGroupFinder.js" defer></script>

  </body>
</html>
